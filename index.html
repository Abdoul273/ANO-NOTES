    <title>AuraTask AI - Gestionnaire de Tâches & Productivité Intelligente</title>
    <script>
      // Thème appliqué avant le premier rendu : pas de flash clair/sombre.
      try {
        var stored = localStorage.getItem('auratask_dark_mode');
        var dark = stored === null ? matchMedia('(prefers-color-scheme: dark)').matches : stored === 'true';
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta name="description" content="Gestionnaire de tâches ultra-épuré doté d'une IA d'optimisation, priorisation automatique, synchronisation calendrier, rappels sur-mesure, mode hors-ligne et rapports PDF/CSV." />
